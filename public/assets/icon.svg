<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.22" />
    </filter>
    <filter id="tauriGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>

  <!-- Solid Flat Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#0E7490" />

  
  <!-- Scale 1.24 centered around (256, 256): translate(-61.44 -61.44) scale(1.24) -->
  <g transform="translate(-61.44 -61.44) scale(1.24)">
    <g filter="url(#shadow)">
      <!-- Modern Open Book Foundation -->
      <path d="M 140, 240 C 180, 230 230, 240 256, 255 C 282, 240 332, 230 372, 240 L 372, 345 C 332, 335 282, 345 256, 360 C 230, 345 180, 335 140, 345 Z"
            fill="#FFFFFF" />
      <!-- Book Center Crease -->
      <line x1="256" y1="255" x2="256" y2="360" stroke="#CBD5E1" stroke-width="3" />

      <!-- Luminous Tauri Floating Bracket Code Elements < > -->
      <path d="M 220, 175 L 185, 205 L 220, 235" fill="none" stroke="#24C8DB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#tauriGlow)" />
      <path d="M 292, 175 L 327, 205 L 292, 235" fill="none" stroke="#FFC131" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="266" y1="170" x2="246" y2="240" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>


  <!-- 2px Specular Rim Stroke -->
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2" />
</svg>